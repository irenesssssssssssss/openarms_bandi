name: Pubblica monitor bandi

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Rome
      GOOGLE_SHEETS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node tests/public_frontend.cjs
      - name: Recupera database precedente
        uses: actions/cache/restore@v4
        with:
          path: data/openarms_bandi.sqlite3
          key: grants-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: grants-db-v1-
      - name: Aggiorna bandi e prepara sito
        run: python build_public.py --refresh
      - name: Conserva database per il prossimo aggiornamento
        uses: actions/cache/save@v4
        with:
          path: data/openarms_bandi.sqlite3
          key: grants-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
